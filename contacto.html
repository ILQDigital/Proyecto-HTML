    <main>
      <h1>Contacta con nosotros</h1>
      <section>
        <form
          action=""
          name="contacto"
          method="post"
          enctype="multipart/form-data"
        >
          <fieldset>
            <legend><strong>Formulario de Contacto</strong></legend>
            <div>
              <p>
                <label for="name">Nombre</label>
                <input type="text" name="nombre" id="name" />
              </p>
            </div>

            <div>
              <p>
                <label for="email">Correo electrónico</label>
                <input type="email" name="email" id="email" />
              </p>
            </div>

            <div>
              <p>
                <label for="texto">Tu pregunta aquí:</label><br />
                <textarea name="texto" rows="5" cols="40" id="texto"></textarea>
              </p>
            </div>
          </fieldset>

          <fieldset>
            <legend>Aceptación de condiciones legales</legend>
            <div>
              <p>
                <label for="declaro">
                  Declaro haber leido y aceptar las condiciones generales del
                  programa y la normativa sobre protección de datos
                </label>
                <input type="checkbox" name="declaro" id="declaro" checked />
              </p>

              <p>
                <label for="acepto">
                  Deseo recibir información sobre novedades y ofertas
                </label>
                <input
                  type="checkbox"
                  name="acepto"
                  id="acepto"
                  value="si"
                  checked
                />
              </p>
            </div>
          </fieldset>

          <div>
            <p><button>Enviar</button> <input type="reset" /></p>
          </div>
        </form>
      </section>
