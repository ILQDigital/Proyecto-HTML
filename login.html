    <!-- Palabras clave para los buscadores -->

    <!-- Autor de la página -->
    <meta name="author" content="@ILQDigital" />

    <!-- Favicon de la página -->
    <link rel="icon" href="img/favicon2.ico" type="image/x-icon" />

    <!-- Codificación-->
    <meta charset="UTF-8" />

    <!-- Para que la web sea responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Para algunos navegadores móviles -->
    <meta name="theme-color" content="#fafafa" />
  </head>

  <body>
    <header>
        <div>
          <img width="40px" src="img/logo_conquer.png" alt="log" />
        </div>
        <nav>
          <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="quienes_somos.html">Quienes_somos</a></li>

        </div>

    <main>
      <h1>Iniciar sesión</h1>

      <form action="" name="acceso" method="post" enctype="multipart/form-data">
        <fieldset>
          <legend>Acceso al aula virtual</legend>
          <div>
            <p>
              <label for="email">Correo electrónico</label>
              <input type="email" name="email" id="email" />
            </p>
          </div>
          <div>
            <p>
              <label for="clave">Clave de acceso</label>
              <input type="password" name="clave" id="clave" />
            </p>
          </div>

          <div>
            <p><button>Enviar</button> <input type="reset" /></p>
          </div>
        </fieldset>
      </form>
    </main>

    <hr />

      <center>
