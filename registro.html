    <main>
      <h1>Forma parte de los alumnos de nuestra escuela Conquer</h1>
      <form
        action=""
        name="registro"
        method="post"
        enctype="multipart/form-data"
      >
        <fieldset>
          <legend><strong>Registro de Usuario</strong></legend>
          <div>
            <p>
              <label for="name">Nombre completo</label>
              <input type="text" name="nombre" id="name" />
            </p>
          </div>

          <div>
            <p>Fecha de tu nacimiento</p>
            <label for="birthday">calendario: </label>
            <input type="date" id="birthday" name="calendario" />
          </div>

          <div>
            <p>
              <label for="mail">Correo electrónico</label>
              <input type="email" name="correo" id="mail" />
            </p>
          </div>

          <div>
            <p>
              <label for="direccion">Dirección completa</label>
              <input type="text" name="direccion" id="direccion" />
            </p>
          </div>

          <div>
            <p>
              <label for="web">Tu página web</label>
              <input type="url" name="web" id="web" />
            </p>
          </div>

          <div>
            <p>
              <label for="foto">Sube una foto</label>
              <input type="file" name="foto" id="foto" />
            </p>
          </div>
        </fieldset>

        <fieldset>
          <legend>Biografía</legend>
          <div>
            <p>
              <label for="biografia">Cuenta algo sobre tí</label><br />
              <textarea
                name="biografia"
                rows="5"
                cols="40"
                id="biografia"
              ></textarea>
            </p>
          </div>
        </fieldset>

        <fieldset>
          <legend>Aceptación de condiciones legales</legend>
          <div>
            <p>
              <label for="declaro">
                Declaro haber leido y aceptar las condiciones generales del
                programa y la normativa sobre protección de datos
              </label>
              <input type="checkbox" name="declaro" id="declaro" checked />
            </p>
          </div>
        </fieldset>

        <div>
          <p><button>Enviar</button> <input type="reset" /></p>
        </div>
      </form>
    </main>
